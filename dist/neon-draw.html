/* Neon Draw — pop-up palette (Krita style): right-click the canvas (or press the pen's side button)
 * for a ring of favourite brushes, recent colours and a colour wheel right under the cursor. */
'use strict';
(function () {
  const U = ND.U, h = U.h, App = ND.App;
  const P = { el: null };
  const SIZE = 340, MID = SIZE / 2;
  const R_BRUSH = 140, SLOT = 46; // favourite brush ring
  const R_RECENT = 99, SWATCH = 17; // recent colour ring
  const HUE_OUT = 80, HUE_IN = 64, SQ = 84; // colour wheel
  const MAX_FAVS = 12;
  const DEFAULT_FAVS = ['HB Pencil', 'Ink Pen', 'G-Pen', 'Hard Round', 'Soft Brush', 'Oil Bristle', 'Watercolour Round', 'Airbrush', 'Charcoal', 'Wet Blender', 'Smudge', 'Eraser Soft'];

  const allPresets = () => App.customPresets.concat(ND.Presets.LIST);
  P.favourites = function () {
    if (!App.state.favBrushes) App.state.favBrushes = DEFAULT_FAVS.slice();
    const all = allPresets();
    return App.state.favBrushes.map((n) => all.find((p) => p.name === n)).filter(Boolean);
  };
  P.isFavourite = (name) => P.favourites().some((p) => p.name === name);
  P.toggleFavourite = function (name) {
    const list = P.favourites().map((p) => p.name), i = list.indexOf(name);
    if (i >= 0) list.splice(i, 1);
    else if (list.length >= MAX_FAVS) { App.toast('The pop-up palette holds ' + MAX_FAVS + ' brushes — remove one first'); return; }
    else list.push(name);
    App.set('favBrushes', list);
    App.emit('favourites');
    App.toast(i >= 0 ? 'Removed “' + name + '” from the pop-up palette' : 'Added “' + name + '” to the pop-up palette (right-click the canvas)');
  };

  // a brush preview cropped into a circle; brushes that lay no paint (erasers, smudge, blenders…) get their tool icon
  const thumbCache = new Map();
  const ICON_FOR = { eraser: 'eraser', smudge: 'smudge', blur: 'smudge', clone: 'clone', dodge: 'dodge', burn: 'burn', mixer: 'smudge' };
  // share of visible pixels, and average "ink" (alpha × brightness) of a preview
  function measure(c) {
    const d = U.ctx(c).getImageData(0, 0, c.width, c.height).data, n = d.length / 4;
    let cov = 0, ink = 0;
    for (let i = 3; i < d.length; i += 4) { if (d[i] > 40) cov++; ink += (d[i] * (d[i - 1] + d[i - 2] + d[i - 3])) / 765; }
    return { cov: cov / n, ink: ink / n / 255 };
  }
  function thumb(p) {
    const key = p.name + (p.custom ? JSON.stringify(p.settings) : '');
    if (thumbCache.has(key)) return thumbCache.get(key);
    const c = U.canvas(SLOT * 2, SLOT * 2), x = U.ctx(c);
    let img = null;
    try { img = ND.Brush.previewStroke(p.settings, 128, 40, '#e6ecf5'); } catch (e) { img = null; }
    const m = img ? measure(img) : { cov: 0, ink: 0 };
    if (!img || p.settings.erase || m.cov < 0.005) {
      const icon = p.settings.erase || p.settings.engine === 'eraser' ? 'eraser' : ICON_FOR[p.settings.engine] || 'brush';
      thumbCache.set(key, icon);
      return icon;
    }
    x.fillStyle = '#24272d'; x.beginPath(); x.arc(SLOT, SLOT, SLOT, 0, U.TAU); x.fill();
    x.save(); x.beginPath(); x.arc(SLOT, SLOT, SLOT - 2, 0, U.TAU); x.clip();
    // faint brushes (airbrush, soft pencils) are stacked a few times so they read at this size
    const reps = U.clamp(Math.round(0.08 / Math.max(0.005, m.ink)), 1, 6);
    for (let k = 0; k < reps; k++) x.drawImage(img, -SLOT * 0.55, SLOT * 0.35, SLOT * 3.1, SLOT * 1.3);

    thumbCache.set(key, c);
    return c;

  let hsv = [0, 0, 0];

    x.lineWidth = HUE_OUT - HUE_IN;

    let g = x.createLinearGradient(m - q, 0, m + q, 0); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(m - q, m - q, SQ, SQ);
    g = x.createLinearGradient(0, m - q, 0, m + q); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
    x.fillStyle = g; x.fillRect(m - q, m - q, SQ, SQ);
    // markers
    const ha = ((hsv[0] - 90) * Math.PI) / 180, hr = (HUE_OUT + HUE_IN) / 2;
    x.lineWidth = 2; x.strokeStyle = '#fff';
    x.beginPath(); x.arc(m + Math.cos(ha) * hr, m + Math.sin(ha) * hr, 6, 0, U.TAU); x.stroke();
    const sx = m - q + hsv[1] * SQ, sy = m - q + (1 - hsv[2]) * SQ;
    x.strokeStyle = hsv[2] > 0.6 && hsv[1] < 0.5 ? '#000' : '#fff';

    return cx;
  }

    const r = c.getBoundingClientRect(), k = (HUE_OUT * 2 + 4) / r.width;

  }

  P.close = function () {
    if (!P.el) return;
    if (App.state.fg !== P.startFg) App.pushRecent(App.state.fg);

    window.removeEventListener('keydown', P.onKey, true);
  };
  P.isOpen = () => !!P.el;
  P.open = function (clientX, clientY) {
    P.close();
    P.startFg = App.state.fg;
    const fg = U.hexToRgb(App.state.fg);
    hsv = U.rgbToHsv(fg[0], fg[1], fg[2]);
    const back = h('div.nd-pp-back');
    const box = h('div.nd-pp', { role: 'dialog', 'aria-label': 'Pop-up palette' });
    const vw = window.innerWidth, vh = window.innerHeight;
    box.style.left = U.clamp(clientX - MID, 4, vw - SIZE - 4) + 'px';
    box.style.top = U.clamp(clientY - MID, 4, vh - SIZE - 4) + 'px';
    back.appendChild(box);
    const at = (r, ang) => ({ x: MID + Math.cos(ang) * r, y: MID + Math.sin(ang) * r });
    const label = h('div.nd-pp-label');
    const setLabel = (t) => { label.textContent = t || App.state.brushName + ' · ' + Math.round(App.state.brush.size) + ' px'; };

    // favourite brushes
    const favs = P.favourites(), n = Math.max(8, Math.min(MAX_FAVS, favs.length + 1));
    for (let i = 0; i < n; i++) {
      const p = favs[i], c = at(R_BRUSH, -Math.PI / 2 + (i / n) * U.TAU);
      const b = h('button.nd-pp-slot' + (p && p.name === App.state.brushName ? '.active' : '') + (p ? '' : '.empty'), { type: 'button', title: p ? p.name + ' — right-click to remove' : 'Add the current brush (' + App.state.brushName + ')' });
      b.style.left = c.x - SLOT / 2 + 'px'; b.style.top = c.y - SLOT / 2 + 'px';
      if (p) {
        const cv = thumb(p);
        if (typeof cv === 'string') { b.classList.add('icon'); b.appendChild(ND.icon(cv, 22)); } else {
          const view = h('canvas', { width: cv.width, height: cv.height });
          U.ctx(view).drawImage(cv, 0, 0);
          b.appendChild(view);
        }
        b.addEventListener('click', () => { App.loadPreset(p); P.close(); App.toast(p.name); });
        b.addEventListener('contextmenu', (e) => { e.preventDefault(); P.toggleFavourite(p.name); P.open(clientX, clientY); });
        b.addEventListener('pointerenter', () => setLabel(p.name));
        b.addEventListener('pointerleave', () => setLabel());

        b.addEventListener('click', () => { P.toggleFavourite(App.state.brushName); P.open(clientX, clientY); });
      }
      box.appendChild(b);
    }
    // recent colours (foreground first)
    const recent = [App.state.fg, App.state.bg].concat(App.state.recent.filter((c) => c !== App.state.fg && c !== App.state.bg)).slice(0, 14);
    const steps = Math.max(8, recent.length);
    recent.forEach((col, i) => {
      const c = at(R_RECENT, -Math.PI / 2 + (i / steps) * U.TAU);
      const s = h('button.nd-pp-swatch' + (i < 2 ? '.fgbg' : ''), { type: 'button', title: i === 0 ? 'Foreground ' + col : i === 1 ? 'Background ' + col + ' (click to use)' : col });

      s.style.left = c.x - SWATCH / 2 + 'px'; s.style.top = c.y - SWATCH / 2 + 'px';
      s.addEventListener('click', () => {
        App.setColour(col, 'fg');

      box.appendChild(s);

    const px = Math.round((HUE_OUT * 2 + 4) * Math.min(2, window.devicePixelRatio || 1));
    const wheel = h('canvas.nd-pp-wheel', { width: px, height: px });
    wheel.style.width = wheel.style.height = HUE_OUT * 2 + 4 + 'px';
    wheel.style.left = wheel.style.top = MID - HUE_OUT - 2 + 'px';

    window.addEventListener('keydown', P.onKey, true);
  };

  ND.Popup = P;
})();

    const pin = h('button.nd-tb-btn', { type: 'button' });
    const head = h('div.nd-tb-head', { title: 'Drag to move the tool panel — drop it near the left or right edge to dock it' }, h('span.nd-tb-grip', '⋮⋮'), cols, pin);
    const el = h('div.nd-tb-body');
    box.append(head, el);

    cols.addEventListener('click', (e) => { e.stopPropagation(); App.set('toolboxCols', (T.colsNow() % 3) + 1); T.layoutToolbox(); });
    pin.addEventListener('click', (e) => { e.stopPropagation(); T.setToolboxMode(App.state.toolboxMode === 'float' ? 'left' : 'float'); });

      b.addEventListener('click', () => App.setTool(t.id));

    const fg = h('button.nd-sw.fg', { title: 'Foreground colour' }), bg = h('button.nd-sw.bg', { title: 'Background colour (click to make active)' });
    const swap = C.iconButton('swap', 'Swap colours (X)', () => App.swapColours(), 'tiny');
    const reset = C.iconButton('reset', 'Black & white (D)', () => App.resetColours(), 'tiny');

    bg.addEventListener('click', () => App.swapColours());

    const qm = h('button.nd-tool.qm', { type: 'button', title: 'Quick mask — paint a selection (Q)' }, ND.icon('quickmask', 20));
    qm.addEventListener('click', () => App.toggleQuickMask());
    el.appendChild(qm);
    App.on('quickmask', () => qm.classList.toggle('active', !!(App.doc && App.doc.quickMask)));
    const refresh = () => {
      const s = App.state;
      for (const id in btns) btns[id].classList.toggle('active', id === 'eraser' ? s.eraserMode && s.tool === 'brush' : s.tool === id && !(id === 'brush' && s.eraserMode));

  // Histogram of what lies below an adjustment layer.

  }

  P.curvesEditor = function (n, commit) {

    const presets = C.select(null, [['', 'Presets…'], ['contrast', 'More contrast'], ['soft', 'Less contrast'], ['bright', 'Brighten'], ['dark', 'Darken'], ['fade', 'Faded film'], ['invert', 'Invert'], ['reset', 'Reset all']], () => '', (v) => {

  M.build = function (bar) {
    let open = null;
    const close = () => { if (open) { open.menu.remove(); open.btn.classList.remove('open'); open = null; } };
    const show = (name, btn) => {
      close();
      const def = M.menus()[name], items = typeof def === 'function' ? def() : def;
      const menu = h('div.nd-menu');
      items.forEach((it) => {
        if (it.sep) { menu.appendChild(h('div.nd-menu-sep')); return; }
        if (it.head) { menu.appendChild(h('div.nd-menu-head', it.head)); return; }
        const chk = it.check ? (it.check() ? '✓' : '') : null;
        const b = h('button.nd-menu-item', { type: 'button' }, h('span.nd-menu-chk', chk == null ? '' : chk), h('span.nd-menu-label', it.label), it.key ? h('span.nd-shortcut', it.key) : null);
        b.addEventListener('click', (e) => { e.stopPropagation(); close(); if (App.doc || name === 'File' || name === 'Help') it.run(); });
        menu.appendChild(b);
      });
      btn.parentNode.appendChild(menu);
      const r = btn.getBoundingClientRect();
      menu.style.left = r.left + 'px';
      menu.style.top = r.bottom + 'px';
      menu.style.maxHeight = window.innerHeight - r.bottom - 12 + 'px';
      btn.classList.add('open');
      open = { menu, btn, name };
    };
    Object.keys(M.menus()).forEach((name) => {
      const btn = h('button.nd-menu-btn', { type: 'button' }, name);
      btn.addEventListener('click', (e) => { e.stopPropagation(); if (open && open.name === name) close(); else show(name, btn); });
      btn.addEventListener('pointerenter', () => { if (open && open.name !== name) show(name, btn); });
      bar.appendChild(btn);
    });
    document.addEventListener('pointerdown', (e) => { if (open && !open.menu.contains(e.target) && !e.target.classList.contains('nd-menu-btn')) close(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { close(); e.stopPropagation(); } }, true);
    M.close = close;
  };

  ND.Menus = M;
})();

  <script>/* js/ui/command.js */
/* Neon Draw — command palette (Ctrl+K): type to find any menu command, tool, brush, filter,
 * adjustment, layer or recent file, then press Enter. */
'use strict';
(function () {
  const U = ND.U, h = U.h, App = ND.App;
  const K = { el: null };
  const MAX_SHOWN = 60;

  // Everything the palette can run. Built fresh on each open so it reflects the current state.
  function collect() {
    const out = [], menus = ND.Menus.menus();
    Object.keys(menus).forEach((name) => {
      const def = menus[name], items = typeof def === 'function' ? def() : def;
      let head = '';
      items.forEach((it) => {
        if (it.head) { head = it.head; return; }
        if (it.sep || !it.run) return;
        const check = it.check ? (it.check() ? ' ✓' : '') : '';
        out.push({ id: 'menu:' + name + ':' + it.label, label: it.label.replace(/…$/, '') + check, cat: name + (head ? ' ▸ ' + head : ''), key: it.key, run: it.run, needsDoc: name !== 'File' && name !== 'Help' });
      });
    });
    App.TOOLS.forEach((t) => out.push({ id: 'tool:' + t.id, label: t.label, cat: 'Tool', key: t.key, icon: t.icon, run: () => App.setTool(t.id), needsDoc: true }));
    App.customPresets.concat(ND.Presets.LIST).forEach((p) => out.push({ id: 'brush:' + p.name, label: p.name, cat: 'Brush ▸ ' + p.cat, run: () => App.loadPreset(p) }));
    if (App.doc) {
      App.doc.allNodes().forEach((n) => out.push({ id: 'layer:' + n.id, label: n.name, cat: 'Go to layer', run: () => App.doc.setActive(n), needsDoc: true, volatile: true }));
    }
    (ND.Files && ND.Files.recentList ? ND.Files.recentList() : []).forEach((r) => out.push({ id: 'recent:' + r.name, label: r.name, cat: 'Open recent', run: () => ND.Files.openRecent(r), volatile: true }));
    return out;
  }

  // Fuzzy score: whole-word and prefix matches beat scattered letters; label beats category.
  function score(item, q) {
    if (!q) return 0;
    const L = item.label.toLowerCase(), C = item.cat.toLowerCase();
    let s = 0;
    for (const w of q.split(/\s+/).filter(Boolean)) {
      let best = -1;
      const i = L.indexOf(w);
      if (i === 0) best = 100; else if (i > 0) best = /[\s(/▸-]/.test(L[i - 1]) ? 80 : 55;
      if (best < 0 && C.includes(w)) best = 30;
      if (best < 0) {
        // letters in order (e.g. "gblr" → Gaussian blur)
        let j = 0, gaps = 0, last = -1;
        for (let k = 0; k < L.length && j < w.length; k++) if (L[k] === w[j]) { if (last >= 0 && k > last + 1) gaps++; last = k; j++; }
        if (j === w.length) best = Math.max(5, 25 - gaps * 4);
      }
      if (best < 0) return -1;
      s += best;
    }
    return s - item.label.length * 0.05;
  }

  K.isOpen = () => !!K.el;
  K.close = function () { if (K.el) { K.el.remove(); K.el = null; } };
  K.open = function (initial) {
    K.close();
    if (ND.Dialogs.isOpen()) ND.Dialogs.close();
    const items = collect();
    const input = h('input.nd-cmd-input', { type: 'text', placeholder: 'Type a command, tool, brush, filter or layer…', spellcheck: false, autocomplete: 'off' });
    const list = h('div.nd-cmd-list', { role: 'listbox' });
    const foot = h('div.nd-cmd-foot', h('span', '↑↓ choose'), h('span', 'Enter run'), h('span', 'Esc close'));
    const box = h('div.nd-cmd', { role: 'dialog', 'aria-label': 'Command palette' }, input, list, foot);
    const back = h('div.nd-cmd-back', box);
    let shown = [], sel = 0;

    const render = () => {
      const q = input.value.trim().toLowerCase();
      if (!q) {
        const rec = (App.state.recentCommands || []).map((id) => items.find((it) => it.id === id)).filter(Boolean);
        const tips = ['menu:Select:Select and Mask…', 'menu:Select:Select subject', 'menu:File:Save', 'menu:Filter:Gaussian Blur…', 'tool:smartsel', 'menu:Layer:New layer'];
        shown = rec.concat(tips.map((id) => items.find((it) => it.id === id)).filter((it) => it && !rec.includes(it)));
        if (!shown.length) shown = items.slice(0, 12);
      } else {
        shown = items.map((it) => ({ it, s: score(it, q) })).filter((r) => r.s >= 0).sort((a, b) => b.s - a.s).slice(0, MAX_SHOWN).map((r) => r.it);
      }
      sel = U.clamp(sel, 0, Math.max(0, shown.length - 1));
      U.clear(list);
      if (!q && shown.length) list.appendChild(h('div.nd-cmd-head', (App.state.recentCommands || []).length ? 'Recent & suggested' : 'Suggested'));
      if (!shown.length) list.appendChild(h('div.nd-cmd-empty', 'Nothing matches “' + input.value + '”'));
      shown.forEach((it, i) => {
        const row = h('div.nd-cmd-row' + (i === sel ? '.sel' : '') + (it.needsDoc && !App.doc ? '.off' : ''), { role: 'option' },
          it.icon ? ND.icon(it.icon, 15) : h('span.nd-cmd-dot'), h('span.nd-cmd-label', it.label), h('span.nd-cmd-cat', it.cat), it.key ? h('kbd', it.key) : null);
        row.addEventListener('pointerenter', () => { if (sel !== i) { sel = i; mark(); } });
        row.addEventListener('click', () => run(it));
        list.appendChild(row);
      });
    };
    const mark = () => {
      list.querySelectorAll('.nd-cmd-row').forEach((r, i) => r.classList.toggle('sel', i === sel));
      const r = list.querySelectorAll('.nd-cmd-row')[sel];
      if (r) r.scrollIntoView({ block: 'nearest' });
    };
    const run = (it) => {
      if (!it) return;
      if (it.needsDoc && !App.doc) return App.toast('Open or create a document first');
      K.close();
      if (!it.volatile) App.set('recentCommands', [it.id].concat((App.state.recentCommands || []).filter((x) => x !== it.id)).slice(0, 8));
      try { it.run(); } catch (e) { console.error(e); App.toast('Could not run “' + it.label + '”: ' + e.message, 3000); }
    };
    input.addEventListener('input', () => { sel = 0; render(); });
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); mark(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); }
      else if (e.key === 'PageDown') { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 8); mark(); }
      else if (e.key === 'PageUp') { e.preventDefault(); sel = Math.max(0, sel - 8); mark(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(shown[sel]); }
      else if (e.key === 'Escape' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); K.close(); }
    });
    back.addEventListener('pointerdown', (e) => { if (e.target === back) K.close(); });
    document.body.appendChild(back);
    K.el = back;
    if (initial) input.value = initial;
    render();
    setTimeout(() => input.focus(), 0);
  };
  K._score = score; // for tests

  ND.Command = K;
})();

</script>

 * output it as a selection, a layer mask, or a new (optionally decontaminated) layer. */
'use strict';
(function () {
  const U = ND.U, h = U.h, C = ND.C, App = ND.App, R = ND.Refine;
  const SM = { el: null };

      e.preventDefault();
      const handles = ND.Files.handlesFromDrop(e.dataTransfer), shift = e.shiftKey;
      files.forEach(async (f, i) => {
        const n = f.name.toLowerCase();
        if (n.endsWith('.ndraw') || n.endsWith('.ora') || n.endsWith('.psd') || n.endsWith('.psb') || n.endsWith('.pigment') || !App.doc || (i === 0 && shift)) App.openFile(f, handles[i] ? await handles[i] : null);
        else App.importLayer(f);
      });
    });

    // restore the last session or start fresh
    const saved = await ND.Store.loadAutosave();
    let restored = false;
    if (saved) {
      try {
        const doc = await ND.Store.restore(saved);
        doc.fileHandle = (await ND.Store.idbGet('autosave-handle')) || null;
        App.setDoc(doc); App.unsaved = false; restored = true; ND.Dialogs.recovered(doc);
      } catch (e) { console.warn('autosave unreadable', e); }
    }
    if (!restored) { App.newDocument(1920, 1080, '#ffffff', 'Untitled'); ND.Dialogs.newDoc(); }
    App.emit('tool'); App.emit('brush'); App.emit('colour');
    setInterval(() => App.autosaveNow(), 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') App.autosaveNow(); });
    window.addEventListener('resize', () => ND.View.request());
    document.body.classList.remove('nd-loading');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
